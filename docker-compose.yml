services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aero
      POSTGRES_PASSWORD: aero_local
      POSTGRES_DB: aero_sgso
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aero -d aero_sgso"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
